name: Update Yahoo league rosters

on:
  schedule:
    - cron: '17 */3 * * *'   # 3시간마다
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rosters
  cancel-in-progress: false

jobs:
  update:
    # setup_yahoo.py 로 연동하기 전에는 건너뜀
    if: ${{ vars.YAHOO_LEAGUE_ID != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch Yahoo league data
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
          YAHOO_LEAGUE_ID: ${{ vars.YAHOO_LEAGUE_ID }}
        run: python scripts/fetch_yahoo.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rosters.json
          git diff --cached --quiet || (git commit -m "리그 로스터 업데이트" && git push)
